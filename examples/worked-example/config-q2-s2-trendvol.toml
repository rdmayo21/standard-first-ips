# SENSITIVITY S2 applied to Q2 (run AFTER seeing config-q2 results; the input itself, trend vol
# 0.12, was pre-declared for Q1 before any scoring). Everything else identical to config-q2.toml.
# Robin (FICTIONAL investor) -- phase 2, Question 2: quit-day switch, tested separately from Q1.
# Person, model, sleeves and scenarios are copied unchanged from config-q1.toml.
# Base mixes: 100 stocks (Q1 base) and 70/30 market/value (the only Q1 candidate inside the
# tie band in all 8 cells). Each candidate is one base mix plus at most ONE quit-day rule.
# "Move 20% to bills" takes the 20 points pro rata from the existing sleeves (70/30 -> 56/24/20);
# likewise for trend (70/30 -> 59.5/25.5/15). Builder default, disclosed.
# Every figure and belief is Robin's (01-standard.md). Inputs fixed 2026-11-07 BEFORE any scoring.
#
# Vols (builder's rule, fixed before scoring): mean of the annualized sd of real monthly returns
# over the two samples (1927-07..2026-02 and 1990-01..2026-02), rounded to 0.01.
#   market      0.1849 / 0.1526 -> 0.169 -> 0.17 (reproduces the brief's 0.17, so the rule is
#               consistent with the anchor)
#   value       0.2582 / 0.1862 -> 0.222 -> 0.22
#   trend_proxy 0.0716 / 0.0706 -> 0.071 -> 0.07
#   bills       0.0178 / 0.0128 -> 0.015; the brief fixes 0.01, kept as given.
# Scenario "stocks 3%" moves value by the same -1.5 points (5.0% -> 3.5%), keeping Robin's
# "half a point over the market"; disclosed as a builder default (see 02-builder-answer.md).
# Centers drawn independently (engine default, no center_corr).

[person]
age = 44.0
start_wealth = 420000
annual_saving = 32000
quit_number = 1660000
annual_spending = 58000
cap_age = 75.0
horizon_age = 95.0
hold_months = 12

[model]
paths = 8000
seed = 1
block_months = 60
k = [0.5, 0.75, 1.0]
tie_years = 1.0
samples = ["1927-07:2100-12", "1990-01:2100-12"]

[data]
dir = "../../plugins/standard-first-ips/skills/standard-first-ips/engine/data"

[sleeves.stocks]
source = "market"
center = 0.045
center_sd = 0.018
vol = 0.17

[sleeves.value]
source = "value"
center = 0.050
center_sd = 0.025
vol = 0.22

[sleeves.trend]
source = "trend_proxy"
center = 0.025
center_sd = 0.020
vol = 0.12

[sleeves.bills]
source = "bills"
center = 0.005
center_sd = 0.010
vol = 0.01

# Within each base mix: keep (fewer rules) first, then bills, then trend.
[[candidates]]
name = "100 stocks, keep"
targets = { stocks = 1.0 }

[[candidates]]
name = "100 stocks, 20% to bills at quit"
targets = { stocks = 1.0 }
post_quit = { stocks = 0.80, bills = 0.20 }

[[candidates]]
name = "100 stocks, 15% to trend at quit"
targets = { stocks = 1.0 }
post_quit = { stocks = 0.85, trend = 0.15 }

[[candidates]]
name = "70/30 market/value, keep"
targets = { stocks = 0.70, value = 0.30 }

[[candidates]]
name = "70/30, 20% to bills at quit"
targets = { stocks = 0.70, value = 0.30 }
post_quit = { stocks = 0.56, value = 0.24, bills = 0.20 }

[[candidates]]
name = "70/30, 15% to trend at quit"
targets = { stocks = 0.70, value = 0.30 }
post_quit = { stocks = 0.595, value = 0.255, trend = 0.15 }

[[scenarios]]
name = "base"

[[scenarios]]
name = "stocks 3%"
centers = { stocks = 0.030, value = 0.035 }

[[scenarios]]
name = "no value premium"
centers = { value = 0.045 }

[[scenarios]]
name = "stocks 3% + no value premium"
centers = { stocks = 0.030, value = 0.030 }
